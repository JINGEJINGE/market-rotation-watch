# Cross-market theme baskets — v2.1 (13 Oct 2026, after a post-cutoff web check of new listings and themes). Edit freely; this file is the theme registry.
# Tickers are Yahoo Finance symbols. Members may sit outside the sector universes (KOSDAQ .KQ, TPEx .TWO).
# Every ticker is validated on load; unresolved tickers are reported in data/outputs/universe_report.json.
# A ticker may belong to several themes (e.g. COIN in both Fintech and Crypto) — overlap is intentional.
# Cap-weighted baskets apply a 30% single-name cap (markets.yaml: params.max_weight) so SPCX / NVDA / TSMC do not become the basket.
#
# Still-private names cannot be members (nothing trades). Watch list for 2026-27 IPOs, add on listing:
#   Anthropic (Nasdaq targeted Oct 2026) and OpenAI (S-1 filed Jun 2026) -> AI Compute / a new AI Software theme;
#   Kraken -> Crypto; Anduril, Shield AI -> Defense / Space; Stripe, Revolut, Plaid -> Fintech; Databricks -> AI Software.

