name: Monthly universe refresh

on:
  schedule:
    - cron: "0 2 1 * *"   # 1st of month, 10:00 Singapore
  workflow_dispatch:
    inputs:
      markets:
        description: "Markets to rebuild, comma-separated (blank = all). Use US after the S&P 500 ∪ Nasdaq-100 change."
        required: false
        default: ""

concurrency:
  group: mrw-pipeline
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Rebuild universes and metadata
        run: |
          cd pipeline
          if [ -n "${{ github.event.inputs.markets }}" ]; then
            python run.py --universe --markets "${{ github.event.inputs.markets }}"
          else
            python run.py --universe
          fi
      - name: Refresh US earnings calendar
        continue-on-error: true
        run: cd pipeline && python run.py --earnings
      - name: Commit
        run: |
          git config user.name "mrw-bot"
          git config user.email "mrw-bot@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && exit 0
          git commit -m "universe refresh $(date -u +%Y-%m-%d)"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
