name: Asia-close run

# Hybrid mode: compute only (no LLM, no Telegram). Commits digests/<date>-asia.md,
# data/outputs/latest.json and the PNGs; the "MRW Asia close memo" Claude task (18:00 SGT) writes the memo.
on:
  schedule:
    - cron: "17 9 * * 1-5"   # 17:17 Singapore Mon-Fri; ~40 min before the Claude task
  workflow_dispatch:

concurrency:
  group: mrw-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Run pipeline (Asia close)
        run: |
          cd pipeline
          python run.py --run asia --no-telegram --no-llm
      - name: Commit results
        run: |
          git config user.name "mrw-bot"
          git config user.email "mrw-bot@users.noreply.github.com"
          git add -A data digests site/public/data
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "asia-close run $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
