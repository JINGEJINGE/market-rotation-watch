name: US-close run

# Hybrid mode: this workflow does the compute only (no LLM, no Telegram).
# It commits digests/<date>-us.md, data/outputs/latest.json and the PNGs;
# the "MRW US close memo" Claude scheduled task (06:30 SGT) reads them and writes the memo.
on:
  schedule:
    - cron: "37 21 * * 1-5"   # 05:37 Singapore Tue-Sat (after Mon-Fri US sessions); ~55 min before the Claude task
  workflow_dispatch:

concurrency:
  group: mrw-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Run pipeline (US close)
        run: |
          cd pipeline
          python run.py --run us --no-telegram --no-llm
      - name: Commit results
        run: |
          git config user.name "mrw-bot"
          git config user.email "mrw-bot@users.noreply.github.com"
          git add -A data digests site/public/data
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "us-close run $(date -u +%Y-%m-%dT%H:%M)"
          # if another run committed meanwhile, keep THIS run's regenerated outputs (-X theirs = the replayed commit)
          git pull --rebase -X theirs origin ${{ github.ref_name }}
          git push
